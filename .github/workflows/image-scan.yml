name: Image scan

# Weekly: scan the published `latest` image with Trivy. New CVEs appear after a release
# without any change in this repository, so the release-time scan alone is not enough.
# The job fails on fixable HIGH/CRITICAL findings; GitHub mails the failure to the owner.
# Fix: bump the base image / dependencies and cut a new release.

on:
  schedule:
    - cron: '47 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: ref
        # OCI references must be lowercase; github.repository keeps the owner's casing
        # (mZ738), which Trivy rejects ("could not parse reference").
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:latest" >> "$GITHUB_OUTPUT"
      # Pinned to a commit (v0.36.0): the action's version tags were force-pushed to
      # malware in March 2026 (CVE-2026-33634).
      - uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.ref.outputs.image }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
